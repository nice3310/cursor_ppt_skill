[project]
name = "ppt-builder"
version = "0.1.0"
description = "AI-driven Presentation-as-Code Cursor skill. Build professional, structured PowerPoint decks from raw ideas or code."
requires-python = ">=3.9"
dependencies = [
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "pillow>=10.4.0",
    "pygments>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"
